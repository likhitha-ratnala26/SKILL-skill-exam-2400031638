name: skill-exam-2400031638

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: skill_exam_2400031638

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skill_exam_2400031638"]
      interval: 5s
      timeout: 5s
      retries: 15

  exam-service:
    image: docker-skill-exam-2400031638:latest
    build:
      context: ./SpringBootProject
      dockerfile: Dockerfile
    container_name: exam-service
    restart: unless-stopped

    ports:
      - "1638:8001"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/skill_exam_2400031638
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: docker

    depends_on:
      postgresdb:
        condition: service_healthy

volumes:
  postgres_data:
